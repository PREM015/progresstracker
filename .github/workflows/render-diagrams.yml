name: Render Mermaid diagrams

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  render-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # so we can push updates

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Render diagrams
        run: npm run diagrams:render-all

      - name: Commit and push generated diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture* || true
          # show diff and only commit when there are changes
          if ! git diff --cached --quiet; then
            git commit -m "ci: update auto-rendered architecture diagrams [skip ci]" || true
            git push origin HEAD:main
          else
            echo "No diagram changes to commit."
          fi
